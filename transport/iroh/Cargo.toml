[package]
name = "agentbus-iroh"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
iroh = "=1.3.0"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rustls-pki-types = "1"

[profile.release]
strip = true
